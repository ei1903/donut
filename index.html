<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e2430">
<title>Donuts</title>
<link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon32.png">
<link rel="image_src" href="assets/images/donuts_logo.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Donuts">
<meta property="og:image" content="assets/images/donuts_logo.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="2048">
<meta property="og:image:height" content="784">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Donuts">
<meta name="twitter:image" content="assets/images/donuts_logo.png">
<link rel="stylesheet" href="assets/css/style.css">

</head>
<body>
<main class="game">
  <div class="hud"><div class="stage" aria-label="現在のステージ"><span id="stage-number">01</span><small id="stage-total">/ 05</small></div><button class="reset" id="reset" type="button" aria-label="最初から" title="最初から"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 10a8 8 0 1 1 1.7 6.8"/><path d="M4.5 4.5V10H10"/></svg></button></div>
  <div class="board-wrap">
    <svg class="board" id="board" viewBox="0 0 900 600" role="img" aria-label="ドーナツを切り、ピースを顔へドラッグ" tabindex="0">
      <g id="people"></g><g id="marks"></g><g id="pieces"></g><g id="guide"></g><g id="effects"></g><g id="celebration"></g>
    </svg>
    <div class="congrats" id="congrats" role="status" hidden><span class="congrats-label">Congratulations!</span></div>
  </div>
  <div class="knife-break" id="knife-break" role="img" aria-label="ナイフが折れた" hidden><div class="knife-break-art"><div class="knife-half blade"></div><div class="knife-half handle"></div><span class="break-spark" aria-hidden="true">✦</span></div></div>
</main>
<script src="assets/js/game.js" defer></script>
</body>
</html>
