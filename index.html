:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#1e2430;color:#f4f0e6}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#1e2430}
.game{position:relative;width:min(100%,1020px);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 15px}
.hud{width:min(100%,900px,calc(150svh - 192px));display:flex;align-items:center;justify-content:space-between;padding:0 18px;margin-bottom:12px}
.board-wrap{position:relative;width:min(100%,900px,calc(150svh - 192px));aspect-ratio:3/2;flex:none}
.stage{display:flex;align-items:baseline;gap:6px;font-size:28px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stage small{font-size:14px;font-weight:600;color:#8c929c;letter-spacing:0}
.reset{width:42px;height:42px;display:grid;place-items:center;border:1px solid #56606d;border-radius:50%;background:transparent;color:#bac1ca;cursor:pointer;padding:0}
.reset svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.reset:hover{color:#fff;border-color:#acb5bf}.reset:focus-visible{outline:2px solid #f4d28b;outline-offset:4px}.board:focus{outline:none}

.board{box-shadow:0 0 0 2px #f4f0e6;border-radius:2px}
.board.dragging{cursor:grabbing}.board.broken{cursor:grab}.board.broken.dragging{cursor:grabbing}
.board.no-cuts{cursor:grab}.board.no-cuts.dragging{cursor:grabbing}
.board.face-hover,.board.broken.face-hover{cursor:pointer}.board.dragging.face-hover{cursor:grabbing}
.face-target{cursor:pointer}.face-target > :not(.face-hit){pointer-events:none}.face-hit{pointer-events:all}
.face-shake{transform-box:fill-box;transform-origin:center;animation:face-shake .38s ease-in-out}
.damage-image{transform-box:fill-box;transform-origin:center;animation:damage-hit .48s ease-out forwards;pointer-events:none}
.returning-piece{pointer-events:none;transform-box:view-box;transform-origin:var(--cx) var(--cy);animation:return-piece .52s ease-out forwards}
.clear-burst{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:clear-burst .85s ease-out both}
.clear-ring{pointer-events:none;transform-box:fill-box;transform-origin:center;animation:clear-ring .75s ease-out both}
@keyframes face-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}42%{transform:translateX(7px)}64%{transform:translateX(-4px)}82%{transform:translateX(2px)}}
@keyframes damage-hit{0%{opacity:1;transform:scale(.5)}30%{opacity:1;transform:scale(1.12)}100%{opacity:0;transform:scale(1.3)}}
@keyframes return-piece{0%{transform:translate(var(--dx),var(--dy)) scale(.24)}100%{transform:translate(0,0) scale(1)}}
@keyframes clear-burst{0%{opacity:0;transform:scale(.45)}18%{opacity:1;transform:scale(1)}60%{opacity:.85;transform:scale(1.08)}100%{opacity:0;transform:scale(1.2)}}
@keyframes clear-ring{0%{opacity:0;transform:scale(.75)}25%{opacity:.8}100%{opacity:0;transform:scale(1.3)}}
.congrats{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:#1e2430e8;color:#76dfd0;cursor:default;pointer-events:auto;animation:congrats-in .75s ease-out .65s both}
.congrats[hidden]{display:none}.congrats-label{font-size:clamp(24px,5vw,54px);font-weight:900;letter-spacing:.025em;white-space:nowrap;text-shadow:0 0 25px #76dfd085}

function vomit(faceIndex,hit){
 const last=history.findLastIndex(item=>item.who===faceIndex&&eaten.has(item.id));
 if(last<0){impact(faceIndex,hit);return}
 const {id}=history.splice(last,1)[0];eaten.delete(id);returning.add(id);
 if(locked&&finished){clearTimeout(timer);locked=false;finished=false;$('board').classList.remove('win');$('congrats').hidden=true;$('celebration').replaceChildren()}
 draw();
 const piece=currentPieces().find(p=>p.id===id),mouth=faces()[faceIndex];let ghost=null;
 if(piece){const origin=point(angle((piece.start+piece.end)/2),(IN+OUT)/2);ghost=drawPiece(piece,cuts.length>=2,$('effects'));ghost.setAttribute('class','returning-piece');ghost.setAttribute('style',`--dx:${mouth.x-origin[0]}px;--dy:${mouth.y+32-origin[1]}px;--cx:${origin[0]}px;--cy:${origin[1]}px`)}
 impact(faceIndex,hit);
 const returnTimer=setTimeout(()=>{returnTimers.delete(returnTimer);ghost?.remove();returning.delete(id);draw()},520);returnTimers.add(returnTimer)
}
function burstFaces(){const layer=$('celebration');layer.replaceChildren();for(const face of faces()){make('circle',{cx:face.x,cy:face.y,r:61,fill:'none',stroke:'#9bd9b6','stroke-width':3,'class':'clear-ring'},layer);const burst=make('g',{'class':'clear-burst'},layer);for(let i=0;i<10;i++){const a=i*TWO/10,dx=Math.cos(a),dy=Math.sin(a);make('line',{x1:face.x+dx*67,y1:face.y+dy*67,x2:face.x+dx*81,y2:face.y+dy*81,stroke:i%2?'#f4ce82':'#9bd9b6','stroke-width':3.5,'stroke-linecap':'round'},burst)}}}
function check(){if(locked)return;const counts=portionCounts();if(!counts.every((_,i)=>faceSatisfied(i,counts)))return;locked=true;finished=true;$('board').classList.add('win');drawPeople();burstFaces();if(level<stages.length-1)timer=setTimeout(()=>start(level+1),1200);else $('congrats').hidden=false}
function cut(slot){if(locked||!canCut(slot))return;cuts.push(slot);totalCuts++;hover=null;draw();if(totalCuts===S){knifeBroken=true;breaking=true;$('board').classList.add('broken');syncKnifeCursor();$('knife-break').hidden=false;timer=setTimeout(()=>{breaking=false;$('knife-break').hidden=true;drawGuide()},1050)}}
function start(n){clearTimeout(timer);clearTimeout(shakeTimer);for(const t of returnTimers)clearTimeout(t);returnTimers.clear();returning.clear();shakingFace=null;if(n===0){totalCuts=0;knifeBroken=S===0}breaking=false;level=n;cuts=[];eaten=new Map();history=[];hover=null;hoverFace=null;down=null;drag=null;locked=false;finished=false;$('effects').replaceChildren();$('celebration').replaceChildren();$('knife-break').hidden=true;$('congrats').hidden=true;$('board').classList.remove('win','dragging');if(!knifeBroken)$('board').classList.remove('broken');$('stage-number').textContent=String(n+1).padStart(2,'0');$('stage-total').textContent='/ '+String(stages.length).padStart(2,'0');draw()}
const board=$('board');board.addEventListener('pointermove',e=>{const p=local(e);board.classList.toggle('face-hover',faceAt(p)>=0);if(down){const dx=p.x-down.p.x,dy=p.y-down.p.y;if(!drag&&down.piece&&Math.hypot(dx,dy)>10){drag={id:down.piece.id,dx,dy};board.classList.add('dragging')}if(drag){drag.dx=dx;drag.dy=dy;const face=faceAt(p);hoverFace=face<0?null:face;draw()}return}const next=nearest(p);if(next!==hover){hover=next;drawGuide()}});
board.addEventListener('pointerleave',()=>{if(!down){board.classList.remove('face-hover');hover=null;drawGuide()}});
board.addEventListener('pointerdown',e=>{if(e.button!==0||breaking||locked&&finished&&level===stages.length-1)return;const p=local(e),face=faceAt(p);board.classList.toggle('face-hover',face>=0);if(face>=0){e.preventDefault();board.setPointerCapture?.(e.pointerId);down={p,face};return}if(locked)return;const piece=pieceAt(p);if(piece||canCut(nearest(p))){e.preventDefault();board.setPointerCapture?.(e.pointerId);down={p,piece}}});
board.addEventListener('pointerup',e=>{if(e.button!==0||!down)return;e.preventDefault();const p=local(e);board.classList.toggle('face-hover',faceAt(p)>=0);if(down.face!==undefined){const face=down.face;down=null;if(faceAt(p)===face)vomit(face,p);return}if(drag){const face=faceAt(p);if(face>=0){eaten.set(drag.id,face);history.push({id:drag.id,who:face});hoverFace=null;drag=null;down=null;board.classList.remove('dragging');draw();check();return}}else{const slot=nearest(p);down=null;cut(slot);return}down=null;drag=null;hoverFace=null;board.classList.remove('dragging');draw()});
board.addEventListener('pointercancel',()=>{down=null;drag=null;hoverFace=null;board.classList.remove('dragging');draw()});
board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('keydown',e=>{if(locked||breaking)return;const n=slotCount();if(n===0)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();hover=hover===null?0:(hover+(e.key==='ArrowRight'?1:n-1))%n;drawGuide()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();cut(hover)}});
$('reset').addEventListener('click',()=>start(0));start(0);
})();
</script>
</body>
