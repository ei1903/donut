<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e2430">
<title>Donut</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#1e2430;color:#f4f0e6}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#1e2430}
.game{width:min(100%,1020px);min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 15px}
.hud{width:min(100%,900px);display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.stage{display:flex;align-items:baseline;gap:6px;font-size:28px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.stage small{font-size:14px;font-weight:600;color:#8c929c;letter-spacing:0}
.reset{width:42px;height:42px;display:grid;place-items:center;border:1px solid #56606d;border-radius:50%;background:transparent;color:#bac1ca;font:28px/1 system-ui;cursor:pointer;padding:0}
.reset:hover{color:#fff;border-color:#acb5bf}.reset:focus-visible,.board:focus-visible{outline:2px solid #f4d28b;outline-offset:4px}
.board{display:block;width:min(100%,900px);height:auto;aspect-ratio:3/2;touch-action:none;user-select:none;cursor:crosshair;overflow:visible}
.board.dragging{cursor:grabbing}.board.fail{animation:shake .36s ease-in-out}.board.win{filter:drop-shadow(0 0 23px #9bd9b675)}
@keyframes shake{25%{transform:translateX(-9px)}50%{transform:translateX(9px)}75%{transform:translateX(-5px)}}
@media(max-width:600px){.game{padding:16px 5px}.hud{padding:0 12px}.stage{font-size:24px}.stage small{font-size:12px}.reset{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="game">
  <div class="hud"><div class="stage" aria-label="現在のステージ"><span id="stage-number">01</span><small>/ 03</small></div><button class="reset" id="reset" type="button" aria-label="ステージをやり直す" title="やり直す">↺</button></div>
  <svg class="board" id="board" viewBox="0 0 900 600" role="img" aria-label="ドーナツを切り、ピースを左右の顔へドラッグ" tabindex="0">
    <g id="people"></g><g id="pieces"></g><g id="marks"></g><g id="guide"></g>
  </svg>
</main>
<script>
(()=>{
'use strict';
const stages=[{m:1,minimum:2},{m:2,minimum:2},{m:3,minimum:4}];
const colors=['#f4ce82','#e99da9','#9ac58e'];
const NS='http://www.w3.org/2000/svg',TWO=Math.PI*2,CX=450,CY=300,OUT=217,IN=105,FACES=[{x:88,y:300},{x:812,y:300}];
const $=id=>document.getElementById(id);
let level=0,cuts=[],eaten=new Map(),hover=null,hoverFace=null,down=null,drag=null,locked=false,finished=false,timer=null;
function make(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);parent.appendChild(e);return e}
function point(a,r){return [CX+Math.sin(a)*r,CY-Math.cos(a)*r]}
function angle(cell){return cell*TWO/(2*stages[level].m)}
function sector(a,b,parent,fill){if(b-a>=TWO-1e-8){sector(a,a+Math.PI,parent,fill);sector(a+Math.PI,b,parent,fill);return}
 const p=point(a,OUT),q=point(b,OUT),u=point(b,IN),v=point(a,IN),large=b-a>Math.PI?1:0;
 make('path',{d:`M ${p[0]} ${p[1]} A ${OUT} ${OUT} 0 ${large} 1 ${q[0]} ${q[1]} L ${u[0]} ${u[1]} A ${IN} ${IN} 0 ${large} 0 ${v[0]} ${v[1]} Z`,fill},parent)}
function currentPieces(){const n=2*stages[level].m,s=[...cuts].sort((a,b)=>a-b);if(s.length<2)return[];return s.map((a,i)=>({id:a,start:a,end:s[(i+1)%s.length]+(i===s.length-1?n:0)}))}
function canCut(slot){if(slot===null||cuts.includes(slot))return false;if(cuts.length<2)return true;const n=2*stages[level].m;const owner=currentPieces().find(piece=>{let v=slot;if(v<=piece.start)v+=n;return v>piece.start&&v<piece.end});return !!owner&&!eaten.has(owner.id)}
function drawPiece(piece,split){const group=make('g',{},$('pieces'));let dx=0,dy=0;if(split){const p=point(angle((piece.start+piece.end)/2),10);dx=p[0]-CX;dy=p[1]-CY}if(drag?.id===piece.id){dx+=drag.dx;dy+=drag.dy}if(dx||dy)group.setAttribute('transform',`translate(${dx} ${dy})`);
 for(let cell=piece.start;cell<piece.end;){const stop=Math.min(piece.end,2*(Math.floor(cell/2)+1));sector(angle(cell),angle(stop),group,colors[Math.floor(cell/2)%stages[level].m]);cell=stop}
 if(split)for(const boundary of [piece.start,piece.end]){const p=point(angle(boundary),IN),q=point(angle(boundary),OUT);make('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#1e2430','stroke-width':2},group)}}
function drawPeople(){const g=$('people');g.replaceChildren();FACES.forEach((face,i)=>{const active=hoverFace===i,stroke=locked&&finished?'#9bd9b6':locked?'#ff7782':'#ff792f';make('circle',{cx:face.x,cy:face.y,r:active?64:58,fill:active?'#ff792f25':'none',stroke,'stroke-width':3},g);for(const offset of [-19,19])make('circle',{cx:face.x+offset,cy:face.y-13,r:5.5,fill:stroke},g);make('path',{d:`M ${face.x-31} ${face.y+22} Q ${face.x} ${face.y+47} ${face.x+31} ${face.y+22}`,fill:'none',stroke,'stroke-width':3,'stroke-linecap':'round'},g)})}
function draw(){const pieces=$('pieces'),marks=$('marks');pieces.replaceChildren();marks.replaceChildren();drawPeople();const n=2*stages[level].m,s=[...cuts].sort((a,b)=>a-b);
 if(s.length<2){for(let f=0;f<stages[level].m;f++)drawPiece({id:2*f,start:2*f,end:2*f+2},false)}else{const available=currentPieces().filter(p=>!eaten.has(p.id));for(const p of available)if(drag?.id!==p.id)drawPiece(p,true);for(const p of available)if(drag?.id===p.id)drawPiece(p,true)}
 if(s.length===1){const p=point(angle(s[0]),IN-2),q=point(angle(s[0]),OUT+2);make('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:'#1e2430','stroke-width':7},marks)}
 for(let i=0;i<n;i++){const a=angle(i),p=point(a,233),q=point(a,249),r=point(a,262),used=cuts.includes(i);make('line',{x1:p[0],y1:p[1],x2:q[0],y2:q[1],stroke:used?'#f4d28b':'#77818e','stroke-width':used?4:2,'stroke-linecap':'round'},marks);make('circle',{cx:r[0],cy:r[1],r:used?4:3,fill:used?'#f4d28b':'#77818e'},marks)}drawGuide()}
function drawGuide(){const g=$('guide');g.replaceChildren();if(locked||drag||!canCut(hover))return;const p=point(angle(hover),251),q=point(angle(hover),262);make('line',{x1:CX,y1:CY,x2:p[0],y2:p[1],stroke:'#fff8e5','stroke-width':3,'stroke-dasharray':'6 7','stroke-linecap':'round'},g);make('circle',{cx:q[0],cy:q[1],r:9,fill:'#f4d28b',stroke:'#1e2430','stroke-width':3},g)}
function local(e){const box=$('board').getBoundingClientRect();return{x:(e.clientX-box.left)*900/box.width,y:(e.clientY-box.top)*600/box.height}}
function nearest(p){const x=p.x-CX,y=p.y-CY,r=Math.hypot(x,y);if(r<28||r>290)return null;const n=2*stages[level].m,a=(Math.atan2(x,-y)+TWO)%TWO;return Math.round(a/TWO*n)%n}
function pieceAt(p){const x=p.x-CX,y=p.y-CY,r=Math.hypot(x,y);if(r<IN-10||r>OUT+17)return null;const n=2*stages[level].m,a=(Math.atan2(x,-y)+TWO)%TWO,cell=a/TWO*n;return currentPieces().find(piece=>{let v=cell;if(v<piece.start)v+=n;return v>=piece.start&&v<piece.end&&!eaten.has(piece.id)})||null}
function faceAt(p){return FACES.findIndex(face=>Math.hypot(p.x-face.x,p.y-face.y)<83)}
function check(){const m=stages[level].m,n=2*m,counts=[Array(m).fill(0),Array(m).fill(0)];for(const piece of currentPieces()){const who=eaten.get(piece.id);if(who===undefined)return;for(let cell=piece.start;cell<piece.end;cell++)counts[who][Math.floor((cell%n)/2)]++}
 const totals=counts.map(row=>row.reduce((a,b)=>a+b,0));const sameTotal=totals[0]===totals[1];const everyFlavor=counts.every(row=>row.filter(v=>v>0).length===m);const sameAmount=counts.every(row=>row.every(v=>v===row[0]));const fewest=cuts.length===stages[level].minimum;
 locked=true;if(sameTotal&&everyFlavor&&sameAmount&&fewest){finished=true;$('board').classList.add('win');drawPeople();if(level<stages.length-1)timer=setTimeout(()=>start(level+1),1200)}else{$('board').classList.add('fail');drawPeople();timer=setTimeout(()=>start(level),1100)}}
function cut(slot){if(locked||!canCut(slot))return;cuts.push(slot);hover=null;draw()}
function start(n){clearTimeout(timer);level=n;cuts=[];eaten=new Map();hover=null;hoverFace=null;down=null;drag=null;locked=false;finished=false;$('board').classList.remove('fail','win','dragging');$('stage-number').textContent=String(n+1).padStart(2,'0');draw()}
const board=$('board');board.addEventListener('pointermove',e=>{const p=local(e);if(down){const dx=p.x-down.p.x,dy=p.y-down.p.y;if(!drag&&down.piece&&Math.hypot(dx,dy)>10){drag={id:down.piece.id,dx,dy};board.classList.add('dragging')}if(drag){drag.dx=dx;drag.dy=dy;const face=faceAt(p);hoverFace=face<0?null:face;draw()}return}const next=nearest(p);if(next!==hover){hover=next;drawGuide()}});
board.addEventListener('pointerleave',()=>{if(!down){hover=null;drawGuide()}});
board.addEventListener('pointerdown',e=>{if(locked)return;const p=local(e),piece=cuts.length>=2?pieceAt(p):null;if(piece||nearest(p)!==null){e.preventDefault();board.setPointerCapture?.(e.pointerId);down={p,piece}}});
board.addEventListener('pointerup',e=>{if(!down)return;e.preventDefault();const p=local(e);if(drag){const face=faceAt(p);if(face>=0){eaten.set(drag.id,face);hoverFace=null;drag=null;down=null;board.classList.remove('dragging');draw();if(eaten.size===currentPieces().length)check();return}}else{const slot=nearest(p);down=null;cut(slot);return}down=null;drag=null;hoverFace=null;board.classList.remove('dragging');draw()});
board.addEventListener('pointercancel',()=>{down=null;drag=null;hoverFace=null;board.classList.remove('dragging');draw()});
board.addEventListener('keydown',e=>{if(locked)return;const n=2*stages[level].m;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();hover=hover===null?0:(hover+(e.key==='ArrowRight'?1:n-1))%n;drawGuide()}else if(e.key==='Enter'||e.key===' '){e.preventDefault();cut(hover)}});
$('reset').addEventListener('click',()=>start(finished&&level===stages.length-1?0:level));start(0);
})();
</script>
</body>
</html>
